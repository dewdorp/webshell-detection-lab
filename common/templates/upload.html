<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>SecuTrace 업로드 테스트</title><link rel="stylesheet" href="styles.css" /></head><body class="cosmic-body"><div class="stars"></div><div class="nebula nebula-left"></div><div class="nebula nebula-right"></div><main class="dashboard-shell"><header class="dashboard-header"><div><p class="eyebrow">Webshell Detection PoC</p><h1>파일 업로드 테스트</h1><p class="form-copy">탐지 Agent가 감시할 실제 업로드 파일을 생성하는 별도 테스트 페이지입니다.</p></div><div class="button-row compact-actions"><a class="secondary-btn" href="/dashboard.html">대시보드</a><a class="secondary-btn" href="/">홈</a></div></header><section class="dashboard-grid upload-grid"><article class="card upload-card"><h2>업로드 대상</h2><p id="watchPath" class="form-copy">업로드 경로 확인 중...</p><form id="uploadForm" class="auth-form upload-form"><label for="fileInput">테스트 파일</label><input id="fileInput" name="file" type="file" required /><button type="submit" class="primary-btn full-width">업로드</button></form><pre id="uploadResult" class="result-box">아직 업로드된 파일이 없습니다.</pre></article><article class="card upload-card"><div class="panel-head"><h2>업로드 파일 목록</h2><button id="refreshFiles" type="button" class="secondary-btn">새로고침</button></div><div id="fileList" class="file-list"></div></article></section></main><script src="upload.js"></script></body></html>
