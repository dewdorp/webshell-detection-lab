<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>SecuTrace 회원가입</title><link rel="stylesheet" href="/styles.css" /></head><body class="cosmic-body"><div class="stars"></div><div class="nebula nebula-left"></div><div class="nebula nebula-right"></div><main class="page-shell"><section class="form-card"><p class="eyebrow">Gemini Onboarding</p><h1>회원가입</h1><p class="form-copy">새 계정을 만들고 보안 활동을 추적할 준비를 시작하세요.</p><form id="signupForm" class="auth-form"><label for="username">사용자명</label><input id="username" name="username" type="text" placeholder="사용자명을 입력하세요" required /><label for="password">비밀번호</label><input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" required /><label for="confirmPassword">비밀번호 확인</label><input id="confirmPassword" name="confirmPassword" type="password" placeholder="비밀번호를 다시 입력하세요" required /><button type="submit" class="primary-btn full-width">회원가입</button></form><div class="link-row"><a href="/login.html">로그인으로</a><a href="/index.html">홈으로</a></div></section></main><script src="/signup.js"></script></body></html>
